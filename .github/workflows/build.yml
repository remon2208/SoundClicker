name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  exe:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller

      - name: Build SoundClicker.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SoundClicker
          --icon assets/app.ico --add-data "assets/app.ico;." --collect-data soundcard
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          --exclude-module scipy --exclude-module matplotlib SoundClicker.pyw

      - name: Self-test the .exe
        shell: pwsh
        run: |
          $p = Start-Process dist\SoundClicker.exe -ArgumentList "--selftest", "selftest.json" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "selftest timed out" }
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: SoundClicker-exe
          path: dist/SoundClicker.exe

      # A push to main publishes a release whenever soundclicker/__init__.py has a new __version__
      - name: Publish release (new version only)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v" + (python -c "import soundclicker; print(soundclicker.__version__)").Trim()
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag is already released"; exit 0 }
          gh release create $tag dist/SoundClicker.exe --target $env:GITHUB_SHA `
            --title "SoundClicker $tag" --notes-file .github/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
